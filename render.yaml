services:
  - type: web
    name: lpelia-accueil
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: MAX_DAILY_QUESTIONS
        value: "2000"
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: GROQ_FALLBACK_MODELS
        value: openai/gpt-oss-120b,llama-3.1-8b-instant
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
