services:
  - type: web
    name: lpelia-accueil
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: MAX_DAILY_QUESTIONS
        value: "500"
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
